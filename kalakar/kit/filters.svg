<!--
  kalakar/kit/filters.svg — GENERATED by gen-filters.mjs. Do not hand-edit.

  Inline this into the document (not <img src>, not <use>): SVG filters are
  only referenceable by CSS url(#id) when the <svg> lives in the same DOM.
  Keep it hidden and aria-hidden. Width/height 0 + position:absolute so it
  never affects layout.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0"
     style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
  <defs>

    <!-- ================================================================
         GRAIN — fractal noise, desaturated. Drive at 3-8% opacity with
         mix-blend-mode: overlay. baseFrequency higher = finer grain.
         ================================================================ -->
    <filter id="kalakar-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>

    <!-- ================================================================
         LENS — Tier 2 liquid glass refraction.
         Apply with:  backdrop-filter: url(#kalakar-lens) blur(6px) saturate(180%);
         Chromium only today; kit/motion.js feature-detects and adds
         .has-refraction to <html>. Tier 1 (blur+saturate) is the baseline.

         scale = refraction strength. 20 subtle / 44 clearly glass / 90 funhouse.
         ================================================================ -->
    <filter id="kalakar-lens" x="0%" y="0%" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feImage href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22320%22%20height%3D%22220%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22rx%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23000000%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23FF0000%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22gy%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23000000%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2300FF00%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22320%22%20height%3D%22220%22%20fill%3D%22%23808080%22%2F%3E%3Crect%20width%3D%22320%22%20height%3D%22220%22%20fill%3D%22url(%23rx)%22%20style%3D%22mix-blend-mode%3Ascreen%22%2F%3E%3Crect%20width%3D%22320%22%20height%3D%22220%22%20fill%3D%22url(%23gy)%22%20style%3D%22mix-blend-mode%3Ascreen%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%2218%22%20width%3D%22284%22%20height%3D%22184%22%20rx%3D%2230%22%20fill%3D%22%23808080%22%2F%3E%3C%2Fsvg%3E" result="map" preserveAspectRatio="none"/>
