      <feImage href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22600%22%20height%3D%22400%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22rx%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23000000%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23FF0000%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22gy%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23000000%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2300FF00%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22600%22%20height%3D%22400%22%20fill%3D%22%23808080%22%2F%3E%3Crect%20width%3D%22600%22%20height%3D%22400%22%20fill%3D%22url(%23rx)%22%20style%3D%22mix-blend-mode%3Ascreen%22%2F%3E%3Crect%20width%3D%22600%22%20height%3D%22400%22%20fill%3D%22url(%23gy)%22%20style%3D%22mix-blend-mode%3Ascreen%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%2230%22%20width%3D%22540%22%20height%3D%22340%22%20rx%3D%2244%22%20fill%3D%22%23808080%22%2F%3E%3C%2Fsvg%3E" result="map" preserveAspectRatio="none"/>
